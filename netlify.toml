# Next.js on Netlify: OpenNext adapter is applied automatically (do not pin @netlify/plugin-nextjs).
# https://docs.netlify.com/frameworks/next-js/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Model IDs are not secrets, but Netlify secrets scanning fails when their
  # values match fallbacks in source / .env.example.
  SECRETS_SCAN_OMIT_KEYS = "OPENAI_BLOG_MODEL,OPENAI_SITE_MODEL,OPENAI_SOCIAL_MODEL,OPENAI_IMAGE_MODEL,GEMINI_VIDEO_MODEL"
  # Ensure Next public env is available at build time for metadata/canonicals.
  # Set the rest in Netlify UI → Environment variables (see .env.example).

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Replaces vercel.json cron: hit the Next.js route so revalidatePath/Tag work.
[functions."daily-blog"]
  schedule = "0 13 * * *"

# Social posting agent: generate draft pipeline + publish due posts.
[functions."social-agent"]
  schedule = "0 * * * *"
